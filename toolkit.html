<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PM Central - Interactive project management toolkit">
<title>PM Central - Project Management Toolkit</title>
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--card:#111827;--input:#0b1220;--border:#1f2937;
  --text:#e2e8f0;--muted:#94a3b8;--primary:#4f46e5;--primary-h:#6366f1;
  --primary-l:#818cf8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --info:#3b82f6;--purple:#a855f7;--shadow:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);--r:10px;--r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem}
.brand-logo{width:36px;height:36px;border-radius:var(--r);background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
.brand h1{font-size:1.05rem;font-weight:700}
.brand p{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
nav{padding:1rem .75rem;flex:1;overflow-y:auto}
.nav{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:var(--r);color:var(--muted);font-weight:500;font-size:.875rem;margin-bottom:.25rem;cursor:pointer;transition:all .2s}
.nav:hover{background:var(--card);color:var(--text)}
.nav.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.nav-icon{font-size:1.1rem}
.user{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.75rem}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.user-name{font-weight:600;font-size:.875rem}
.user-role{font-size:.75rem;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:64px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;gap:1rem;flex-shrink:0}
.search{position:relative;flex:1;max-width:480px}
.search input{width:100%;height:38px;padding:0 1rem 0 2.25rem;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.875rem;outline:none}
.search input:focus{border-color:var(--primary)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.actions{display:flex;gap:.5rem;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--border)}
.content{flex:1;overflow-y:auto;padding:1.5rem 2rem}
.view{display:none;animation:fi .3s ease}
.view.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.view-h h1{font-size:1.75rem;font-weight:700;margin-bottom:.25rem}
.muted{color:var(--muted)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1rem;border-radius:var(--r);font-weight:600;font-size:.875rem;border:1px solid transparent;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.bp{background:var(--primary);color:#fff;border-color:var(--primary)}
.bp:hover{background:var(--primary-h)}
.bs{background:var(--card);color:var(--text);border-color:var(--border)}
.bs:hover{background:var(--border)}
.bd{background:var(--danger);color:#fff;border-color:var(--danger)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:1.5rem;box-shadow:var(--shadow)}
.ch{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ch h3{font-size:1rem;font-weight:600}
.cb{padding:1.25rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;display:flex;gap:1rem;align-items:center;box-shadow:var(--shadow)}
.kpi-i{width:48px;height:48px;border-radius:var(--r);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.kpi-v{font-size:2rem;font-weight:700;line-height:1.2}
.kpi-l{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.kpi-t{font-size:.75rem;color:var(--muted);margin-top:.25rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1.5rem;margin-bottom:1.5rem}
.raid-c{display:flex;flex-direction:column;gap:.85rem;padding:.5rem 0}
.raid-b{display:flex;align-items:center;gap:.75rem}
.raid-l{width:110px;font-size:.85rem;color:var(--muted)}
.raid-f{height:28px;background:linear-gradient(90deg,var(--primary),var(--purple));border-radius:6px;display:flex;align-items:center;padding:0 .75rem;min-width:40px;transition:width .5s ease}
.raid-b[data-t="RISK"] .raid-f{background:linear-gradient(90deg,#ef4444,#f87171)}
.raid-b[data-t="ASSUMPTION"] .raid-f{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.raid-b[data-t="ISSUE"] .raid-f{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.raid-b[data-t="DEPENDENCY"] .raid-f{background:linear-gradient(90deg,#a855f7,#c084fc)}
.raid-v{font-size:.85rem;font-weight:600;color:#fff;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem}
.tbl th,.tbl td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.tbl th{font-weight:600;color:var(--muted);text-transform:uppercase;font-size:.7rem;letter-spacing:.05em;background:var(--bg);position:sticky;top:0}
.tbl tbody tr:hover{background:var(--bg)}
.tbl-c{text-align:center;padding:3rem 1rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:999px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pill.success{background:rgba(16,185,129,.15);color:var(--success)}
.pill.warning{background:rgba(245,158,11,.15);color:var(--warning)}
.pill.danger{background:rgba(239,68,68,.15);color:var(--danger)}
.pill.info{background:rgba(59,130,246,.15);color:var(--info)}
.pill.muted{background:var(--border);color:var(--muted)}
.filter-bar{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{height:38px;padding:0 .85rem;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.875rem;outline:none;font-family:inherit;min-width:160px;flex:1;max-width:280px}
.filter-bar select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right .5rem center;background-size:18px;padding-right:2.25rem;cursor:pointer}
.proj-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}
.proj{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;transition:all .2s}
.proj:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.proj-n{font-size:1.05rem;font-weight:600;margin-bottom:.25rem}
.proj-d{font-size:.85rem;color:var(--muted);margin-bottom:1rem;line-height:1.5;min-height:2.5rem}
.proj-m{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:.75rem}
.prog{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:.5rem}
.prog-f{height:100%;background:linear-gradient(90deg,var(--primary),var(--purple));border-radius:999px}
.proj-s{display:flex;gap:1rem;margin-top:1rem;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;padding:.65rem 1rem;color:var(--muted);font-weight:500;font-size:.875rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;display:flex;align-items:center;gap:.5rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary-l);border-bottom-color:var(--primary)}
.tc{background:var(--border);padding:.1rem .5rem;border-radius:999px;font-size:.7rem;font-weight:600}
.tab.active .tc{background:var(--primary);color:#fff}
.form-g{margin-bottom:1rem}
.form-l{display:block;margin-bottom:.4rem;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.input,.select{height:38px;padding:0 .85rem;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.875rem;outline:none;font-family:inherit;width:100%}
.select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right .5rem center;background-size:18px;padding-right:2.25rem}
textarea{height:auto;padding:.65rem .85rem;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.875rem;font-family:inherit;outline:none;width:100%;resize:vertical;min-height:80px}
textarea:focus,.input:focus,.select:focus{border-color:var(--primary)}
.modal-o{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal-o.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.mh{padding:1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mh h2{font-size:1.1rem;font-weight:600}
.mc{width:32px;height:32px;border-radius:6px;background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer}
.mc:hover{background:var(--bg);color:var(--text)}
.mb{padding:1.25rem;overflow-y:auto;flex:1}
.mf{padding:1rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}
.toasts{position:fixed;top:80px;right:20px;z-index:1100;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--info);padding:.85rem 1rem;border-radius:var(--r);box-shadow:var(--shadow-lg);min-width:280px;max-width:400px;display:flex;align-items:center;gap:.75rem;animation:si .3s ease}
.toast.success{border-left-color:var(--success)}
.toast.warning{border-left-color:var(--warning)}
.toast.danger{border-left-color:var(--danger)}
.toast-t{font-weight:600;font-size:.875rem}
.toast-m{font-size:.8rem;color:var(--muted)}
@keyframes si{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.empty{text-align:center;padding:3rem 1.5rem;color:var(--muted)}
.empty-i{font-size:3rem;margin-bottom:1rem;opacity:.5}
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.mk{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.mk-l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.mk-v{font-size:1.5rem;font-weight:700}
.text-danger{color:var(--danger)}
.tbl-act{display:flex;gap:.25rem}
.bi{width:32px;height:32px;padding:0;background:transparent;border:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.bi:hover{background:var(--bg-card);color:var(--text)}
.bi.danger:hover{color:var(--danger)}
.hb-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.hb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;transition:all .2s;cursor:pointer}
.hb:hover{border-color:var(--primary);transform:translateY(-2px)}
.hb-t{font-weight:600;font-size:.95rem;margin-bottom:.4rem}
.hb-s{font-size:.8rem;color:var(--muted);margin-bottom:.5rem;line-height:1.4}
.hb-tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tpl-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
.tpl{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.5rem;cursor:pointer;transition:all .2s}
.tpl:hover{border-color:var(--primary);transform:translateY(-2px)}
.tpl-i{width:48px;height:48px;border-radius:var(--r);background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:1rem}
.tpl-t{font-size:1.1rem;font-weight:600;margin-bottom:.5rem}
.tpl-d{font-size:.85rem;color:var(--muted);line-height:1.5;margin-bottom:1rem}
.tpl-pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.75rem;font-family:monospace;font-size:.75rem;color:var(--muted);max-height:120px;overflow:hidden;line-height:1.5;white-space:pre-wrap}
.ai-l{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;height:calc(100vh - 200px);min-height:500px}
.ai-s{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;overflow-y:auto}
.ai-s h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.85rem}
.ai-a{list-style:none}
.ai-a li{display:flex;gap:.75rem;padding:.75rem;border-radius:var(--r);cursor:pointer;transition:all .2s;margin-bottom:.25rem}
.ai-a li:hover{background:var(--bg)}
.ai-a li.active{background:var(--primary);color:#fff}
.ai-a li.active .muted{color:rgba(255,255,255,.8)}
.ai-ic{font-size:1.4rem;flex-shrink:0}
.ai-n{font-weight:600;font-size:.875rem}
.ai-d{font-size:.75rem;color:var(--muted);margin-top:.15rem}
.ai-c{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.ai-h{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ai-h h3{font-size:1rem;font-weight:600}
.ai-msgs{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.ai-msg{display:flex;gap:.75rem;max-width:80%}
.ai-msg.bot{align-self:flex-start}
.ai-msg.user{align-self:flex-end;flex-direction:row-reverse}
.ai-av{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-msg.user .ai-av{background:var(--primary)}
.ai-cnt{background:var(--bg);padding:.75rem 1rem;border-radius:var(--r);font-size:.875rem;line-height:1.5;white-space:pre-wrap}
.ai-msg.user .ai-cnt{background:var(--primary);color:#fff}
.ai-in{border-top:1px solid var(--border);padding:1rem;display:flex;gap:.75rem;align-items:flex-end}
.ai-in textarea{flex:1;min-height:60px;max-height:120px}
.set-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1.5rem}
.set-act{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.85rem}
.act-list{display:flex;flex-direction:column;gap:.85rem}
.act-i{display:flex;gap:.75rem;padding:.6rem;border-radius:var(--r);transition:background .2s}
.act-i:hover{background:var(--bg)}
.act-ic{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-tx{font-size:.875rem;line-height:1.4}
.act-tm{font-size:.75rem;color:var(--muted);margin-top:.15rem}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#475569}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">
<div class="brand-logo">PM</div>
<div><h1>PM Central</h1><p>Delivery Toolkit</p></div>
</div>
<nav>
<a class="nav active" data-v="dashboard"><span class="nav-icon">??</span><span>Dashboard</span></a>
<a class="nav" data-v="projects"><span class="nav-icon">??</span><span>Projects</span></a>
<a class="nav" data-v="raid"><span class="nav-icon">??</span><span>RAID Tracker</span></a>
<a class="nav" data-v="actions"><span class="nav-icon">?</span><span>Action Items</span></a>
<a class="nav" data-v="handbook"><span class="nav-icon">??</span><span>Handbook</span></a>
<a class="nav" data-v="meetings"><span class="nav-icon">??</span><span>Meetings</span></a>
<a class="nav" data-v="templates"><span class="nav-icon">??</span><span>Templates</span></a>
<a class="nav" data-v="ai"><span class="nav-icon">??</span><span>AI Copilot</span></a>
<a class="nav" data-v="settings"><span class="nav-icon">??</span><span>Settings</span></a>
</nav>
<div class="user">
<div class="user-avatar">P</div>
<div><div class="user-name">PM User</div><div class="user-role">Account Manager</div></div>
</div>
</aside>
<main class="main">
<div class="topbar">
<div class="search">
<span class="search-icon">??</span>
<input type="text" id="gs" placeholder="Search projects, RAID, action items...">
</div>
<div class="actions">
<button class="b bp" id="qa">+ Quick Add</button>
</div>
</div>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-o" id="mo">
<div class="modal">
<div class="mh"><h2 id="mt"></h2><button class="mc" id="mc">×</button></div>
<div class="mb" id="mb"></div>
<div class="mf">
<button class="b bs" id="mcan">Cancel</button>
<button class="b bp" id="msav">Save</button>
</div>
</div>
</div>
<div class="toasts" id="tc"></div>
<script>
/* PM Central Toolkit - single-file vanilla JS app */
(function(){
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, ...children) => {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "className") e.className = attrs[k];
      else if (k === "onClick") e.addEventListener("click", attrs[k]);
      else if (k === "onChange") e.addEventListener("change", attrs[k]);
      else if (k === "onInput") e.addEventListener("input", attrs[k]);
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  };
  const fmt = (d) => new Date(d).toISOString().split("T")[0];
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const STATUS_CLS = (s) => {
    s = (s || "").toLowerCase();
    if (["completed","closed","resolved","done"].includes(s)) return "success";
    if (["blocked","overdue","high"].includes(s)) return "danger";
    if (["in progress","pending","medium"].includes(s)) return "warning";
    if (["open","low","planned"].includes(s)) return "info";
    return "muted";
  };
  const PRI_CLS = (p) => ({ high: "danger", medium: "warning", low: "info" }[(p || "").toLowerCase()] || "muted");
  const isOverdue = (d) => d && new Date(d) < new Date();
  const projectName = (id) => { const p = S.projects.find(x => x.id === id); return p ? p.name : "—"; };
  const nextId = (arr) => arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1;

  const DEFAULT = () => {
    const t = new Date();
    return {
      projects: [

  const STORAGE_KEY = "pmcentral_data_v1";
  let S = null;
  function load() {
    try {

      if (raw) { S = JSON.parse(raw); return; }
    } catch (e) {}
    S = DEFAULT();
    save();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function addActivity(icon, text) {
    S.activities.unshift({ icon, text, time: "Just now" });
    if (S.activities.length > 20) S.activities = S.activities.slice(0, 20);
  }
  function toast(title, msg, type) {
    type = type || "info";
    const t = el("div", { className: "toast " + type },
      el("div", null, type === "success" ? "?" : type === "warning" ? "??" : type === "danger" ? "?" : "??"),
      el("div", null,
        el("div", { className: "toast-t" }, title),
        msg ? el("div", { className: "toast-m" }, msg) : null
      )
    );
    $("tc").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 3500);
  }
  function showModal(title, bodyHtml, onSave) {
    $("mt").textContent = title;

          el("option", { value: "dashboard", selected: "" }, "Dashboard"),
          el("option", { value: "raid" }, "RAID Tracker"),
          el("option", { value: "actions" }, "Action Items")
        )
      ),
      el("div", { className: "form-g" }, el("label", { className: "form-l" }, "Email Notifications"),
        el("select", { className: "select" },
          el("option", { value: "all" }, "All Updates"),
          el("option", { value: "important", selected: "" }, "Important Only"),
          el("option", { value: "none" }, "None")
        )
      )
    ));
    g.appendChild(c2);

    const c3 = el("div", { className: "card" });
    c3.appendChild(el("div", { className: "ch" }, el("h3", null, "Data Management")));
    c3.appendChild(el("div", { className: "cb" },
      el("p", { className: "muted" }, "Export or reset your data"),
      el("div", { className: "set-act" },
        el("button", { className: "b bs", onClick: exportData }, "?? Export Data (JSON)"),
        el("button", { className: "b bs", onClick: () => $("imp").click() }, "?? Import Data"),
        el("button", { className: "b bd", onClick: resetData }, "??? Reset All Data")
      ),
      el("input", { type: "file", id: "imp", accept: ".json", style: "display:none", onChange: importData })
    ));
    g.appendChild(c3);
    wrap.appendChild(g);
    return wrap;
  }
  function exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pmcentral-export-" + fmt(new Date()) + ".json";
    a.click();
    toast("Exported", "pmcentral-export.json", "success");
  }
  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        S = JSON.parse(ev.target.result);
        save(); render();
        toast("Imported", file.name, "success");
      } catch (e) {
        toast("Import failed", "Invalid JSON", "danger");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
  function resetData() {
    if (!confirm("Reset all data? This cannot be undone.")) return;
    S = DEFAULT();
    save(); render();
    toast("Reset complete", "All data restored to defaults", "success");
  }

  // ===================== INIT =====================
  function init() {
    load();
    document.querySelectorAll(".nav").forEach(n => n.addEventListener("click", () => nav(n.dataset.v)));
    $("mc").addEventListener("click", hideModal);
    $("mcan").addEventListener("click", hideModal);
    $("mo").addEventListener("click", (e) => { if (e.target === $("mo")) hideModal(); });
    $("qa").addEventListener("click", () => {
      const opts = [
        { l: "New Project", f: openNewProjectModal },
        { l: "New RAID Item", f: openNewRaidModal },
        { l: "New Action Item", f: openNewActionModal },
        { l: "New Meeting", f: openNewMeetingModal },
        { l: "New Article", f: openNewArticleModal }
      ];
      const list = el("div");
      opts.forEach(o => list.appendChild(el("button", { className: "b bs", style: "width:100%;margin-bottom:.5rem", onClick: () => { hideModal(); o.f(); } }, o.l)));
      showModal("Quick Add", "");
      $("mb").appendChild(list);
      $("msav").style.display = "none";
    });
    $("gs").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      if (!q) return;
      if (S.projects.some(p => p.name.toLowerCase().includes(q) || (p.description||"").toLowerCase().includes(q))) nav("projects");
      else if (S.raidItems.some(r => r.title.toLowerCase().includes(q) || (r.description||"").toLowerCase().includes(q))) nav("raid");
      else if (S.actionItems.some(a => (a.title||"").toLowerCase().includes(q))) nav("actions");
      else if (S.handbookArticles.some(h => (h.title||"").toLowerCase().includes(q) || (h.summary||"").toLowerCase().includes(q))) nav("handbook");
      else if (S.meetings.some(m => (m.title||"").toLowerCase().includes(q) || (m.summary||"").toLowerCase().includes(q))) nav("meetings");
    });
    nav(S.currentView || "dashboard");
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
